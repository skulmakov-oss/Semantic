authorization:
  rust_implementation: true
  rust_implementation_scope: >-
    Narrow host bridges (filesystem, process execution, persistence,
    native window/renderer effects) inside prom-ui-backend-native and a
    new minimal prom-ui-workbench-host crate where an existing crate
    cannot cleanly own the capability, PLUS (per
    owner_directive_2026_08_02) a new prom-ui-iced-adapter crate that may
    depend on Iced directly to implement generic UI mechanics (layout,
    text shaping/measurement, rendering, clipping, scrolling, focus,
    pointer capture, DPI handling, window integration, WGPU presentation)
    behind a public, Iced-free Prom UI component contract. Application/
    domain logic (Workbench screen hierarchy, labels, actions, selection,
    N/F/T/S meaning) goes in .sm source / existing Semantic-owned
    WorkbenchApp state, not Rust or Iced, wherever the current
    architecture supports it.
  new_external_dependency: >-
    minimal_only, EXCEPT Iced 0.14.0 (MIT, pinned exact version) is
    explicitly authorized per owner_directive_2026_08_02 as the private
    native UI substrate behind prom-ui-iced-adapter -- see
    third_party/iced/UPSTREAM.md.
  cli_command_implementation: false
  test_addition: true
  fixture_addition: true
  documentation_addition: true
  public_api_change: true
  dependency_lockfile_update: true
  owner_issue_lifecycle: false
  workflow_changes: false
  roadmap_changes: false
  project_changes: false
  workbench_implementation: true
  semantic_studio_implementation: false
  alm_changes: false
  hub_changes: false

