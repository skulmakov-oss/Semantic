task:
  id: CORE-QUAD-LOGIC-FRAME-V1-SPEC
  title: Freeze Quad Logic Frame v1 spec
  type: docs
  mode: active

intent:
  summary: docs(core-quad): freeze Quad Logic Frame v1 spec
  issue: "#1405"

layer:
  name: core-quad
  owner: semantic-core-quad

scope:
  allowed_paths:
    - docs/spec/quad_logic_frame_v1.md
    - tests/legacy_guards.rs
    - .harness/current.task.yaml
    - .harness/reports/CORE-QUAD-LOGIC-FRAME-V1-SPEC.md

  forbidden_paths:
    - src/**
    - crates/**
    - tools/**
    - scripts/**
    - README.md
    - Cargo.toml
    - Cargo.lock

actions:
  allowed:
    - read
    - edit_allowed_paths
    - push
    - create_pr

  forbidden:
    - modify_cargo_toml
    - modify_cargo_lock
    - loader_claim
    - runtime_claim
    - production_ui_claim
    - level4_claim

constraints:
  - docs only
  - no behavior changes
  - no Cargo changes
  - no loader claim
  - no runtime claim
  - no production UI claim
  - no Level 4 claim

verification:
  required:
    - git diff --check
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness-check.ps1
    - git status --short

report:
  output: .harness/reports/CORE-QUAD-LOGIC-FRAME-V1-SPEC.md