task:
  id: VM-QUAD-OPCODE-SEMANTIC-CORE-QUAD-BRIDGE
  title: Route scalar quad opcodes through semantic-core-quad maps
  type: feat
  mode: active

intent:
  summary: feat(vm): route quad opcodes through semantic-core-quad maps
  issue: "#1438"

layer:
  name: vm
  owner: sm-vm

scope:
  allowed_paths:
    - crates/sm-vm/Cargo.toml
    - crates/sm-vm/src/semcode_vm.rs
    - .harness/current.task.yaml
    - .harness/reports/VM-QUAD-OPCODE-SEMANTIC-CORE-QUAD-BRIDGE.md

  forbidden_paths:
    - crates/sm-format/**
    - crates/sm-ir/**
    - crates/sm-emit/**
    - crates/sm-verify/**
    - crates/semantic-core-quad/**
    - crates/ton618-core/**
    - src/**
    - docs/**
    - README.md
    - Cargo.toml
    - Cargo.lock

actions:
  allowed:
    - read
    - edit_allowed_paths
    - push
    - create_pr

  forbidden:
    - loader_claim
    - runtime_claim
    - production_ui_claim
    - level4_claim

constraints:
  - Add semantic-core-quad dependency
  - Update quad_not, quad_and, quad_or, quad_implies
  - Update Opcode::QImpl execution
  - Add bridge matching tests
  - Do not change opcode IDs or semantics
  - Do not add EQUIV or NAND/NOR

verification:
  required:
    - cargo test -p sm-vm --quiet
    - cargo test -p semantic-core-quad --quiet
    - git diff --check
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness-check.ps1
    - git status --short

report:
  output: .harness/reports/VM-QUAD-OPCODE-SEMANTIC-CORE-QUAD-BRIDGE.md