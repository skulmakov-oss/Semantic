task:
  id: AGENT-INFRA-CONTEXT-1849-HARDEN
  title: "agent infrastructure: harden context-checkpoint schema enforcement and validator invariants (#1849 remediation)"
  type: governance_maintenance_transition
  mode: active_temporary_governance_envelope
  supersedes: SEMANTIC-STABLE-FOUNDATION-SSF-07
  authorized_by: >-
    Repository owner explicit authorization (chat, 2026-08-30) for a
    narrow #1849 hardening remediation pass against open PR #1851, following
    an external adversarial audit that found the validator never actually
    invokes the JSON Schema it claims to enforce, the Harness staleness check
    fails open when .harness/current.task.yaml is missing/malformed, fallback
    authorization accepts any non-empty string, SHA patterns accept 7-40 char
    prefixes with prefix-style comparison, budget telemetry coherence is
    unenforced, and several checkpoint sections receive no structural
    validation at all. Temporary governance envelope to correct the schema,
    validator, and reconciliation docs; SSF-07 will be restored immediately
    after the hardening commit, before verification/handoff.

intent:
  summary: >-
    Make .harness/context-checkpoint.schema.json the actual structural
    source of truth (validated via PowerShell 7's built-in Test-Json,
    proven against this schema's Draft 2020-12 keyword subset with negative
    tests) and reduce scripts/context_checkpoint_check.ps1 to schema
    validation plus cross-field/referential/repository semantic invariants
    that JSON Schema cannot express: mandatory authority anchors, global ID
    uniqueness, fallback owner-decision referential integrity, budget
    telemetry mode coherence, and fail-closed live-repository/Harness
    staleness detection. No compiler, runtime, dependency, workflow, or
    Semantic domain-skill changes.

