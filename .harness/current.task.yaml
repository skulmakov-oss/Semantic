task:
  id: SHF-FOUNDATION-DELIVERY-STABLE
  title: "Stable Foundation Engineering Authorization Boundary"
  type: foundation_delivery
  target: >-
    Enable bounded, explicitly owner-authorized Foundation compiler, language,
    verifier, SemCode, runtime, and builtin engineering within one permanent
    technical surface. Implementation Independence. Specification Unity.
    Deterministic Proof. The trusted PR base envelope and checker remain the
    authority for candidate admission; ordinary work cannot modify that authority.
  mode: active
  supersedes: FOUNDATION-GOVERNANCE-MIGRATION
  issues: [1910]
  must_remain_open: [1910]
  base_sha: db86eb7897367d880d303e8f803a06e5219b3cd2
  authorized_by: >-
    Repository owner GO (2026-10-09, "Semantic Upstream Phase U0c") installs
    this permanent Foundation boundary after U0a (#2020) and U0b (#2021).
    Each concrete task still requires explicit OWNER GO, bounded scope,
    implementation/tests/specification evidence, qualification, one primary PR,
    and separate OWNER MERGE GO. Stored base_sha values record this transition;
    live PR base/head identities come from immutable trusted GitHub event data.

intent:
  summary: >-
    Ordinary Foundation work proceeds inside this stable boundary without
    recurring Harness changes, under stage-specific OWNER GO and normative
    contracts. File permission does not approve new opcodes, SemCode revisions,
    public contract changes, release claims, or self-hosting completion; those
    require explicit technical justification and deterministic qualification.
    U0c itself changes only this envelope and proves hosted base-side admission.
    No technical implementation, release/tag work, or merge is authorized by U0c.
  decision_record: docs/agents/WORKFLOW.md

governance_constraints:
  compiler_implementation: true
  language_implementation: true
  runtime_implementation: true
  verifier_changes: true
  semcode_changes: true
  builtin_changes: true
  workflow_changes: false
  dependency_changes: false
  release_tag_changes: false
  merge_without_owner_go: false

scope:
  allowed_paths:
    - crates/sm-*/**
    - crates/smc-cli/**
    - crates/semantic-core-quad/**
    - tests/**
    - docs/spec/**
    - docs/architecture/**
    - README.md
    - CONTRIBUTING.md

  forbidden_paths:
    - .harness/current.task.yaml
    - .harness/**
    - .github/**
    - scripts/**
    - AGENTS.md
    - CONSTRAINTS.md
    - tests/harness_scope_enforcement.ps1
    - docs/agents/WORKFLOW.md
    - Cargo.toml
    - Cargo.lock
    - crates/*/Cargo.toml
    - crates/*/Cargo.lock
    - crates/prom-*/**
    - apps/**
    - examples/**
    - reports/**
    - tools/**
    - experiments/**
    - third_party/**
    - ton618_legacy/**
    - prom-ui*
    - releases/**
    - release/**
    - artifacts/**
    - docs/releases/**
    - docs/roadmap/**

authorization:
  rust_implementation: true
  language_implementation: true
  documentation_addition: true
  documentation_correction: true
  test_addition: true
  workflow_changes: false
  dependency_changes: false
  github_issue_lifecycle: false
  git_commit_push_pr: true
  merge_after_review_and_checks: false
  stable_promotion: false

constraints:
  base_branch: main
  base_sha: db86eb7897367d880d303e8f803a06e5219b3cd2
  c1_sha: 89641da8237f4fcefb50cf1958a50e4d4003aea7
  release_tag: v1.2.0
  release_assets_immutable: true
  no_release_or_tag: true
  no_issue_close: true
  no_merge_without_owner_go: true
  no_historical_document_rewrite: true
  one_logical_change_per_pr: true
  evidence_before_claims: true
  explicit_owner_go_for_each_task: true
  explicit_owner_go_for_opcode_or_public_contract_changes: true
  normative_contracts_required: true
  verifier_first_required: true
  deterministic_proof_required: true
  unrelated_fa_findings_out_of_scope: true

# Standing cross-authority anchors carried forward from the sealed SSF
# envelope (checked by tests/ssf_status_drift.rs against the immutable
# dependency map / decision record). Historical reference only: they grant
# no SSF authority to Foundation tasks.
ssf_reference:
  active_phase: SSF-12
  issue: 1583
  ownership_position: A
  no_rust_equivalent_lifetime_region_claim: true
