task:
  id: AGENT-INFRA-03
  title: "agent infrastructure: Semantic skill routing and domain guards decomposition"
  type: governance_maintenance_transition
  mode: active_temporary_governance_envelope
  supersedes: AGENT-INFRA-02
  authorized_by: >-
    Repository owner explicit authorization in GitHub issue #1846 and Umbrella
    #1843. Temporary governance-maintenance envelope to authorize decomposition
    of the monolithic Semantic skill into five focused domain guards and
    reference synchronization; SSF-07 development envelope will be restored
    prior to merge.

intent:
  summary: >-
    Decompose the monolithic .agents/skills/semantic skill into five focused local
    skills (semantic router, semantic-source-authoring-guard,
    semantic-verifier-runtime-guard, semantic-contract-release-guard,
    semantic-ui-boundary-guard). Synchronize routing references in AGENTS.md,
    .agents/AGENTS.md, and docs/agents/WORKFLOW.md. Enforce fail-closed stop on
    spec-vs-fixture conflict, trusted-vs-raw verifier boundary, release honesty,
    and UI authority boundaries without changing compiler, runtime, or CI behavior.

scope:
  allowed_paths:
    - .harness/current.task.yaml
    - .agents/skills/semantic/SKILL.md
    - .agents/skills/semantic-source-authoring-guard/SKILL.md
    - .agents/skills/semantic-verifier-runtime-guard/SKILL.md
    - .agents/skills/semantic-contract-release-guard/SKILL.md
    - .agents/skills/semantic-ui-boundary-guard/SKILL.md
    - .agents/AGENTS.md
    - AGENTS.md
    - docs/agents/WORKFLOW.md

  forbidden_paths:
    - CONSTRAINTS.md
    - docs/spec/**
    - .github/workflows/**
    - .github/PULL_REQUEST_TEMPLATE/**
    - .github/copilot-instructions.md
    - .github/instructions/**
    - Cargo.toml
    - Cargo.lock
    - crates/**
    - apps/**
    - src/**
    - tests/**
    - third_party/**
    - ton618_legacy/**

authorization:
  rust_implementation: false
  language_implementation: false
  documentation_addition: true
  documentation_correction: true
  test_addition: false
  workflow_changes: false
  dependency_changes: false
  github_issue_lifecycle: true
  git_commit_push_pr: true
  merge_after_review_and_checks: true
  stable_promotion: false

constraints:
  issue: 1846
  umbrella_issue: 1843
  base_branch: main
  one_logical_change_per_pr: true
  evidence_before_claims: true
  no_production_code_change: true
  no_dependency_change: true
  no_ci_workflow_change: true
  no_autonomous_fallback: true
  restore_ssf07_before_merge: true
