task:
  id: SHF-1B-COMPILER-TEXT-IMPLEMENTATION
  title: "Implement and qualify compiler-grade UTF-8 text primitives (SHF-1B)"
  type: implementation_qualification
  target: "Implement the seven operations frozen by docs/spec/compiler_text_v0.md (semantic.compiler.text/0.1) through the existing Call builtin path and qualify them through the verified pipeline (#2004), as SHF-1B of #1910. No new SemCode opcode."
  mode: active
  supersedes: SHF-1A-COMPILER-TEXT-CONTRACT
  issues: [2004]
  must_remain_open: [1910]
  base_sha: 5256cc07244b19f11df0b65a8bcffb2e0c447a9e
  authorized_by: >-
    Repository owner explicit authorization (2026-10-08, "OWNER TASK - SHF-1B
    COMPILER-GRADE TEXT IMPLEMENTATION & QUALIFICATION"): controlled
    governance-envelope transition to SHF-1B-COMPILER-TEXT-IMPLEMENTATION on its
    dedicated branch. Paths limited to owners proven by discovery; no SemCode
    format/opcode change; no merge without separate owner GO; #1910 stays open.

intent:
  summary: >-
    Add text_len, text_byte_at, text_slice, text_starts_with, text_ends_with,
    text_find and text_is_empty as reserved language-owned builtins on the
    existing Call path under CAP_TEXT_VALUES, returning canonical Option values,
    and qualify them end to end. SHF-1 overall stays open: the lexer probe is
    blocked on SHF-3.
  decision_record: docs/spec/compiler_text_v0.md

