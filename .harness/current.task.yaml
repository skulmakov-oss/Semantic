task:
  id: DOCS-README-ARCHITECTURE-RENDER-ALT-TEXT-ENGLISH
  title: Translate README architecture render alt text to English
  type: docs
  mode: active

intent:
  summary: docs(readme): translate architecture render alt text to English

layer:
  name: documentation
  owner: readme

scope:
  allowed_paths:
    - README.md
    - .harness/current.task.yaml
    - .harness/reports/DOCS-README-ARCHITECTURE-RENDER-ALT-TEXT-ENGLISH.md

  forbidden_paths:
    - src/**
    - crates/**
    - tests/**
    - tools/**
    - scripts/**
    - docs/**
    - Cargo.toml
    - Cargo.lock

actions:
  allowed:
    - read
    - edit_allowed_paths
    - push
    - create_pr

  forbidden:
    - modify_cargo_toml
    - modify_cargo_lock
    - loader_claim
    - runtime_claim
    - production_ui_claim
    - level4_claim

constraints:
  - translation only
  - no technical meaning changes
  - no behavior changes
  - no Cargo changes
  - no loader claim
  - no runtime claim
  - no production UI claim
  - no Level 4 claim

verification:
  required:
    - git diff --check
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness-check.ps1
    - git status --short

report:
  output: .harness/reports/DOCS-README-ARCHITECTURE-RENDER-ALT-TEXT-ENGLISH.md