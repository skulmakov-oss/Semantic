task:
  id: AGENT-INFRA-CONTEXT-1849
  title: "agent infrastructure: context budgeting and Semantic checkpoint compression"
  type: governance_maintenance_transition
  mode: active_temporary_governance_envelope
  supersedes: AGENT-INFRA-03
  authorized_by: >-
    Repository owner explicit authorization in GitHub issue #1849. Temporary
    governance-maintenance envelope to authorize implementation of the
    context-economy protocol, checkpoint schema, validator script, and
    workflow/verification integration; SSF-07 development envelope will be
    restored prior to merge.

intent:
  summary: >-
    Implement a deterministic, auditable context-economy protocol for Semantic
    coding agents. Establish four context classes (PINNED, ACTIVE, COMPRESSED,
    EVICTABLE), machine-readable JSON schema, dependency-free PowerShell validator
    with self-test and staleness detection, and workflow/verification documentation
    without modifying compiler, runtime, language, or Semantic domain skills.

scope:
  allowed_paths:
    - .harness/current.task.yaml
    - .harness/context-checkpoint.schema.json
    - docs/agents/CONTEXT.md
    - docs/agents/WORKFLOW.md
    - docs/agents/VERIFICATION.md
    - AGENTS.md
    - scripts/context_checkpoint_check.ps1
    - .gitignore

  forbidden_paths:
    - CONSTRAINTS.md
    - .agents/skills/**
    - docs/spec/**
    - .github/workflows/**
    - .github/PULL_REQUEST_TEMPLATE/**
    - .github/copilot-instructions.md
    - .github/instructions/**
    - Cargo.toml
    - Cargo.lock
    - crates/**
    - apps/**
    - src/**
    - tests/**
    - third_party/**
    - ton618_legacy/**

authorization:
  rust_implementation: false
  language_implementation: false
  documentation_addition: true
  documentation_correction: true
  test_addition: false
  workflow_changes: false
  dependency_changes: false
  github_issue_lifecycle: true
  git_commit_push_pr: true
  merge_after_review_and_checks: true
  stable_promotion: false

constraints:
  issue: 1849
  base_branch: main
  one_logical_change_per_pr: true
  evidence_before_claims: true
  no_production_code_change: true
  no_dependency_change: true
  no_ci_workflow_change: true
  no_semantic_skills_change: true
  no_autonomous_fallback: true
  restore_ssf07_before_merge: true
