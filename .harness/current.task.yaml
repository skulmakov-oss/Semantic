intent:
  summary: >-
    Migration window only. The admissible changes are one control-plane PR
    adding .github/workflows/native-matrix.yml and then one envelope-only PR
    installing the pinned successor or, on abort, restoring the unchanged
    Foundation envelope. No compiler, language, runtime, verifier, SemCode,
    dependency, release or tag work is authorized while this envelope is active.
  decision_record: docs/agents/WORKFLOW.md

