task:
  id: AGENT-INFRA-01
  title: "agent governance: establish foundation, router, invariants, workflow, and verification contracts"
  type: agent_governance_foundation_and_harness_contract
  mode: active
  supersedes: SEMANTIC-STABLE-FOUNDATION-SSF-07
  authorized_by: >-
    Repository issue #1844 (AGENT-INFRA-01: Governance Foundation & Harness Contract).

intent:
  summary: >-
    Establish AGENTS.md as the canonical agent router and bootstrap entry point.
    Create CONSTRAINTS.md containing only hard repository invariants.
    Define the Harness as the per-task capability and authorization envelope.
    Create docs/agents/WORKFLOW.md defining agent toolstack, methodology, and lifecycle.
    Create docs/agents/VERIFICATION.md documenting exact verification commands and CI parity gates.

scope:
  allowed_paths:
    - .harness/current.task.yaml
    - AGENTS.md
    - CONSTRAINTS.md
    - docs/agents/WORKFLOW.md
    - docs/agents/VERIFICATION.md

  forbidden_paths:
    - .github/**
    - apps/**
    - crates/**
    - experiments/**
    - src/**
    - third_party/**
    - ton618_legacy/**

authorization:
  rust_implementation: false
  language_implementation: false
  documentation_addition: true
  documentation_correction: true
  test_addition: false
  workflow_changes: false
  dependency_changes: false
  github_issue_lifecycle: true
  git_commit_push_pr: true
  merge_after_review_and_checks: false
  stable_promotion: false

constraints:
  issue: 1844
  base_branch: main
  one_logical_change_per_pr: true
  evidence_before_claims: true
  current_main_is_not_stable: true
  no_verifier_bypass: true
  no_fail_open_behavior: true
  no_silent_fallback_or_downgrade: true
  no_weakening_deleting_or_skipping_tests: true
  no_hidden_compatibility_shims: true
  no_dependency_or_ci_workflow_changes: true
  no_compiler_runtime_or_language_behavior_changes: true
  no_ruflo_usage: true
  ponytail_disabled_by_default: true
  harness_per_task_envelope_enforced: true
  no_completion_claim_without_fresh_verification_evidence: true
