task:
  id: SHF-FOUNDATION-DELIVERY-STABLE
  title: "Stable Foundation Delivery Profile — Strategy v1.1"
  type: foundation_stage_delivery
  target: >-
    Authorize normal Foundation engineering stages (SHF-1 through SHF-9)
    under Strategy v1.1 («Implementation Independence. Specification Unity.
    Deterministic Proof.»). Permits implementation, tests, spec updates, and
    qualification within Surface A (Foundation compiler/runtime crates, tests,
    specs) under explicit owner GO without per-stage envelope churn.
    Permanently protects trust root, release machinery, and toolchain configurations.
  mode: active
  supersedes: SHF-2A2-COMPLETE-HOLD
  issues: [1910]
  must_remain_open: [1910]
  base_sha: 35f0c21a900061e76e52a7584fa1aa27230da6c7
  authorized_by: >-
    Repository owner explicit program (2026-10-09, "OWNER PROGRAM - SEMANTIC UPSTREAM
    FOUNDATION LIBERATION + COMPLETE SHF-2"): Phase U0 one-time governance liberation
    transition from SHF-2A2-COMPLETE-HOLD to stable Foundation delivery profile
    SHF-FOUNDATION-DELIVERY-STABLE on dedicated branch governance/shf-foundation-stable.
    Reconciles upstream workflow with Strategy v1.1.

intent:
  summary: >-
    Establish a stable Foundation delivery envelope for Semantic Foundation milestones
    (crates/sm-*, crates/smc-cli, tests, docs/spec), removing per-stage envelope churn
    while keeping trust roots and release boundaries strictly fail-closed.
  decision_record: docs/spec/compiler_bytes_v0.md

governance_constraints:
  compiler_implementation: true
  language_implementation: true
  runtime_implementation: true
  verifier_changes: true
  semcode_changes: true
  opcode_changes: false
  builtin_changes: true
  workflow_changes: false
  dependency_changes: false
  release_tag_changes: false
  self_hosting_started: false
  merge_without_owner_go: false

scope:
