    - .harness/current.task.yaml
    - crates/sm-*/**
    - crates/smc-cli/**
    - crates/semantic-core-quad/**
    - tests/**
    - docs/spec/**
    - docs/architecture/**
    - README.md
    - CONTRIBUTING.md

  forbidden_paths:
    - .github/**
    - scripts/**
    - Cargo.toml
    - Cargo.lock
    - crates/prom-*/**
    - crates/core-lab/**
    - crates/semantic-hub*/**
    - crates/ton618*/**
    - apps/**
    - examples/**
    - reports/**
    - tools/**
    - experiments/**
    - third_party/**
    - ton618_legacy/**
    - prom-ui*

authorization:
  rust_implementation: true
  language_implementation: true
  documentation_addition: true
  documentation_correction: true
  test_addition: true
  workflow_changes: false
  dependency_changes: false
  github_issue_lifecycle: true
  git_commit_push_pr: true
  merge_after_review_and_checks: false
  stable_promotion: false

constraints:
  base_branch: main
  base_sha: 35f0c21a900061e76e52a7584fa1aa27230da6c7
  c1_sha: 89641da8237f4fcefb50cf1958a50e4d4003aea7
  release_tag: v1.2.0
  release_assets_immutable: true
  no_release_or_tag: true
  no_issue_close: true
  no_merge_without_owner_go: true
  no_historical_document_rewrite: true
  one_logical_change_per_pr: true
  evidence_before_claims: true
  no_new_semcode_opcode: true
  unrelated_fa_findings_out_of_scope: true

