task:
  id: SEMANTIC-STABLE-FOUNDATION-SSF-08
  title: "ownership: select and qualify a memory/ownership model position"
  type: ownership_and_memory_positioning_contract_qualification_and_bounded_implementation
  mode: active
  supersedes: SEMANTIC-STABLE-FOUNDATION-SSF-07
  authorized_by: >-
    Repository owner direct instruction (chat, 2026-08-08) to execute GitHub
    umbrella #1569 continuously in strict SSF-00 through SSF-12 dependency
    order. SSF-07 closed through the governance-only transition PR this file
    is part of, branched from main at
    437ea872609bda57bb5bf735dfa3f29376377b8c: four residual findings
    (#1633, #1639, #1646, #1861) repaired and merged, one lifecycle-only
    correction (#1717) reconciled without new code, and every other open
    SSF-07-module finding classified RETURN or DEFER rather than silently
    absorbed. Full evidence:
    docs/roadmap/stable_foundation/ssf07_exit_reconciliation_record.md. Only
    SSF-08 is now active.

intent:
  summary: >-
    Select an ownership/memory model position (Position A vs Position B, per
    the Stable Foundation dependency map) before repairing any individual
    ownership finding — this is SSF-08's required first step, not an
    implementation-order convenience. Only after that decision is recorded:
    work the ownership-state cluster in dependency order (ScopeEnv/state
    model -> control-flow propagation -> lowering event preservation -> OWN0
    identity -> OWN0 event timing -> VM/frame/host ownership boundary ->
    runtime quota and failure taxonomy), each grounded in the selected
    position rather than patched independently. Add positive end-to-end
    tests and deterministic negative cases for every included ownership
    form; give every deferred form an explicit non-goal and a deterministic
    rejection diagnostic instead of leaving it silently unsupported.

