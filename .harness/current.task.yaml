authorization:
  rust_implementation: true
  rust_implementation_scope: >-
    Extends the two existing Hub crates and smc-cli's existing hub.rs
    module. No new crates, no new external dependencies (turbovec stays
    pinned at =0.9.0). No changes to compiler, verifier, VM, SemCode, or
    any existing PROMETHEUS crate's public API.
  new_external_dependency: false
  cli_command_implementation: true
  test_addition: true
  fixture_addition: true
  documentation_addition: true
  public_api_change: true
  public_api_change_detail: >-
    semantic-hub's public surface grows (new session/transaction
    modules, extended HubFault/HubReply/HubProvenance shapes,
    HUB_ENVELOPE_SCHEMA_VERSION bump 1 -> 2 with backward-compatible
    request-side defaulting); registered with tests/public_api_contracts.rs
    per the existing snapshot-guard mechanism. smc-cli's own public
    surface (lib.rs re-exports) is unchanged.
  dependency_lockfile_update: false
  owner_issue_lifecycle: true
  workflow_changes: false
  roadmap_changes: false
  project_changes: false
  workbench_implementation: false
  semantic_studio_implementation: false
  alm_changes: false
  hub_changes: true

constraints:
  one_branch_one_pr: true
  no_child_issues: true
  no_unrelated_workbench_studio_alm_changes: true
  hub_governs_execution_semantic_owns_meaning: true
  no_subprocess_wasm_or_remote_execution_mode_in_v0: true
  no_direct_turbovec_bypass_of_hub_admission: true
  turbovec_output_is_untrusted_evidence_not_semantic_truth: true
  sensitive_capabilities_denied_by_default: true
  in_process_execution_is_not_process_isolation: true
  determinism_class_measured_not_assumed: true
  canonical_fixtures_get_gitattributes_lf_rule_and_regression_guard: true
  no_tokio_or_async_runtime_added: true
  session_executor_is_synchronous_and_deterministic: true
