task:
  id: CORE-QUAD-SCALAR-AND-OR-LUTS
  title: Add scalar AND/OR truth tables
  type: feat
  mode: active

intent:
  summary: feat(core-quad): add scalar AND/OR truth tables
  issue: "#1406"

layer:
  name: core-quad
  owner: semantic-core-quad

scope:
  allowed_paths:
    - crates/semantic-core-quad/src/logic_frame.rs
    - .harness/current.task.yaml
    - .harness/reports/CORE-QUAD-SCALAR-AND-OR-LUTS.md

  forbidden_paths:
    - crates/ton618-core/**
    - src/**
    - tests/**
    - tools/**
    - scripts/**
    - docs/**
    - README.md
    - Cargo.toml
    - Cargo.lock

actions:
  allowed:
    - read
    - edit_allowed_paths
    - push
    - create_pr

  forbidden:
    - modify_cargo_toml
    - modify_cargo_lock
    - loader_claim
    - runtime_claim
    - production_ui_claim
    - level4_claim

constraints:
  - semantic-core-quad only
  - scalar AND/OR only
  - no XOR
  - no IMPLIES/EQUIV/NAND/NOR
  - no VM/opcode changes
  - no runtime changes
  - no mask migration

verification:
  required:
    - cargo test -p semantic-core-quad --quiet
    - git diff --check
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness-check.ps1
    - git status --short

report:
  output: .harness/reports/CORE-QUAD-SCALAR-AND-OR-LUTS.md