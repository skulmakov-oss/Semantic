task:
  id: CORE-QUAD-LATTICE-ALIASES
  title: Add explicit lattice aliases on QuadroReg32
  type: feat
  mode: active

intent:
  summary: feat(core-quad): add explicit lattice aliases
  issue: "#1444"

layer:
  name: core_quad
  owner: semantic-core-quad

scope:
  allowed_paths:
    - crates/semantic-core-quad/src/lib.rs
    - .harness/current.task.yaml
    - .harness/reports/CORE-QUAD-LATTICE-ALIASES.md

  forbidden_paths:
    - crates/sm-vm/**
    - crates/sm-format/**
    - crates/sm-ir/**
    - crates/sm-emit/**
    - crates/sm-verify/**
    - crates/ton618-core/**
    - src/**
    - docs/**
    - tests/**
    - tools/**
    - README.md
    - Cargo.toml
    - Cargo.lock

actions:
  allowed:
    - read
    - edit_allowed_paths
    - push
    - create_pr

  forbidden:
    - change_opcodes
    - modify_vm

verification:
  required:
    - cargo test -p semantic-core-quad --quiet
    - git diff --check
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness-check.ps1
    - git status --short

report:
  output: .harness/reports/CORE-QUAD-LATTICE-ALIASES.md