  title: Reserve explicit QTruth opcode slots
  type: docs
  mode: active

intent:
  summary: docs(format): reserve explicit QTruth opcode slots
  issue: "#1452"

layer:
  name: core_quad
  owner: sm-format

scope:
  allowed_paths:
    - docs/roadmap/core_quad/qtruth_opcode_reservation.md
    - .harness/current.task.yaml
    - .harness/reports/FORMAT-RESERVE-QTRUTH-SLOTS.md

  forbidden_paths:
    - crates/sm-format/**
    - crates/sm-ir/**
    - crates/sm-emit/**
    - crates/sm-verify/**
    - crates/sm-vm/**
    - crates/semantic-core-quad/**
    - crates/ton618-core/**
    - src/**
    - tests/**
    - tools/**
    - README.md
    - root Cargo.toml
    - Cargo.lock

actions:
  allowed:
    - read
    - edit_allowed_paths
    - push
    - create_pr

  forbidden:
    - modify_rust_code

verification:
  required:
    - git diff --check
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness-check.ps1
    - git status --short

report:
  output: .harness/reports/FORMAT-RESERVE-QTRUTH-SLOTS.md