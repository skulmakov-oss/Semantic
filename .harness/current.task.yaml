  one_active_ssf_phase: true
  active_phase: SSF-12
  issue: 1583
  umbrella_issue: 1569
  owner_authorized: true
  candidate_sha_frozen: true
  frozen_candidate_sha: a1591bc1b3c0458ec617d704c4a0dcb9670b1fb5
  qualification_only: true
  mandatory_gate_skip_is_not_pass: true
  earlier_phase_defects_return_to_owner: true
