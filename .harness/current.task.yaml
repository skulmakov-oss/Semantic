task:
  id: PRE-BOOTSTRAP-GOVERNANCE-CLOSEOUT
  title: "Close threat, provenance, and migration governance before self-hosting"
  type: governance_closeout
  target: "Land repository-wide threat model, untrusted-project policy, provenance/signing policy and migration/deprecation governance (#1371, #1374, #1378) before #1910 implementation."
  mode: active
  supersedes: NATIVE-AUDIT-02
  issues: [1371, 1374, 1378]
  must_remain_open: [1910]
  base_sha: 242c684dcf0702f1affdf3a2bfa5f05eabeaae41
  authorized_by: >-
    Repository owner direct instruction (2026-10-06, "GO - PRE-BOOTSTRAP
    GOVERNANCE CLOSEOUT"). Governance/documentation only; one comment-only
    edit in crates/semantic-hub/src/provenance.rs; no implementation, no
    signing, no release/tag, no merge without owner GO; #1910 not started.

intent:
  summary: >-
    Reconcile and land the pre-bootstrap governance contracts around the
    SSF-10 artifact authority, including explicit self-hosting bootstrap
    trust, provenance and migration rules, without starting self-hosting.
  decision_record: docs/roadmap/pre_bootstrap_governance_closeout.md

governance_constraints:
  compiler_implementation: false
  language_implementation: false
  runtime_implementation: false
  verifier_changes: false
  semcode_changes: false
  workflow_changes: false
  dependency_changes: false
  release_tag_changes: false
  self_hosting_started: false
  merge_without_owner_go: false
  comment_only_source_exception: crates/semantic-hub/src/provenance.rs

scope:
  allowed_paths:
    - .harness/current.task.yaml
    - SECURITY.md
    - docs/security/**
    - docs/privacy/semantic_hub_data_policy_v0.md
    - docs/architecture/semantic_hub_v0.md
    - docs/spec/hub/hub_api_v0.md
    - docs/roadmap/pre_bootstrap_governance_closeout.md
    - docs/roadmap/language_maturity/deprecation_and_migration.md
    - docs/roadmap/language_maturity/stability_and_compatibility.md
    - docs/roadmap/language_maturity/compatibility_policy_stack.md
    # Comment-only exception (no executable change); every other crates/**
    # path stays outside allowed scope and is rejected by harness-check.
    - crates/semantic-hub/src/provenance.rs

  forbidden_paths:
    - tests/**
    - examples/**
    - "**/*.sm"
    - src/**
    - apps/**
    - reports/**
    - tools/**
    - scripts/**
    - Cargo.toml
    - Cargo.lock
    - experiments/**
    - third_party/**
    - ton618_legacy/**
    - prom-ui*

authorization:
  rust_implementation: false
  language_implementation: false
  documentation_addition: true
  documentation_correction: true
  test_addition: false
  workflow_changes: false
  dependency_changes: false
  github_issue_lifecycle: false
  git_commit_push_pr: true
  merge_after_review_and_checks: false
  stable_promotion: false

constraints:
  base_branch: main
  base_sha: 242c684dcf0702f1affdf3a2bfa5f05eabeaae41
  c1_sha: 89641da8237f4fcefb50cf1958a50e4d4003aea7
  release_tag: v1.2.0
  release_assets_immutable: true
  no_release_or_tag: true
  no_issue_close: true
  no_merge_without_owner_go: true
  no_historical_document_rewrite: true
  one_logical_change_per_pr: true
  evidence_before_claims: true
  unrelated_fa_findings_out_of_scope: true

