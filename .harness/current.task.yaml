intent:
  summary: >-
    Execute SSF-10 (#1581) in a single bounded implementation pass: establish
    explicit, deterministic, and testable compatibility/trust contracts across
    source language, package manifest (semantic.toml), diagnostic schemas,
    standard library, SemCode wire format, verifier admission, and deterministic
    runtime execution. Bind canonical compiled-artifact identity to SHA-256
    digests following FIPS PUB 180-4, separate producer provenance from
    inspecting toolchain identity via companion provenance sidecars, enforce
    digest-based staleness and mismatch authority immune to mtime backdating,
    provide strictly non-destructive fail-closed migration inspection, and
    maintain complete signing honesty (explicitly unsigned).

