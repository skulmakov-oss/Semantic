    - tests/legacy_guards.rs

  forbidden_paths:
    - examples/**
    - "**/*.sm"
    - src/**
    - crates/**
    - apps/**
    - reports/**
    - tools/**
    - scripts/**
    - Cargo.toml
    - Cargo.lock
    - experiments/**
    - third_party/**
    - ton618_legacy/**
    - prom-ui*

