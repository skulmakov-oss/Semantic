task:
  id: SEMANTIC-HUB-V0-TURBOVEC-E2E
  title: "feat(hub): implement Semantic Hub v0 with TurboVec in one complete pass"
  type: implementation
  mode: active
  supersedes: SMC-LOOK-UI-FRAME-LF-FIX
  authorized_by: "repository owner direct instruction, Issue #1553 (owner implementation issue for architecture #1526; consumes policy issues #1371-#1374)"

intent:
  summary: "feat(hub): complete Semantic Hub v0 with TurboVec"

scope:
  # New governed execution boundary for external computational tools
  # (Semantic Hub v0), with TurboVec (crates.io `turbovec` =0.9.0, MIT) as
  # the first real reference adapter, wired end-to-end through a new
  # `smc hub` CLI surface. Two new crates; smc-cli gains one new private
  # module and two new dependencies; root Cargo.toml gains two workspace
  # members. No existing crate's public API is modified.
  allowed_paths:
