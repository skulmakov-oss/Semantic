task:
  id: DOCS-CYRILLIC-CONTENT-INVENTORY
  title: Inventory remaining Cyrillic documentation content
  type: audit
  mode: active

intent:
  summary: audit(docs): inventory remaining Cyrillic content

layer:
  name: documentation
  owner: docs

scope:
  allowed_paths:
    - .harness/current.task.yaml
    - .harness/reports/DOCS-CYRILLIC-CONTENT-INVENTORY.md

  forbidden_paths:
    - src/**
    - crates/**
    - tests/**
    - tools/**
    - scripts/**
    - docs/**
    - README.md
    - Cargo.toml
    - Cargo.lock

actions:
  allowed:
    - read
    - edit_allowed_paths
    - push
    - create_pr

  forbidden:
    - modify_docs
    - modify_cargo_toml
    - modify_cargo_lock
    - loader_claim
    - runtime_claim
    - production_ui_claim
    - level4_claim

constraints:
  - refactor only
  - no behavior changes
  - no docs changes
  - no Cargo changes
  - no loader claim
  - no runtime claim
  - no production UI claim
  - no Level 4 claim

verification:
  required:
    - git diff --check
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness-check.ps1
    - git status --short

report:
  output: .harness/reports/DOCS-CYRILLIC-CONTENT-INVENTORY.md