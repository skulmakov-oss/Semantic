task:
  id: POST-UI-READER-CORE-DOCS-CLOSEOUT
  title: Close out ProjectionBundle reader-core evidence docs
  type: docs-closeout
  mode: active

intent:
  summary: Record the already-merged fixture-facing ProjectionBundle sketch reader-core evidence closeout.

layer:
  name: documentation
  owner: post-ui

scope:
  allowed_paths:
    - .harness/current.task.yaml
    - docs/roadmap/post_ui/projection_bundle_reader_evidence_closeout.md

  forbidden_paths:
    - scripts/**
    - tools/**
    - tests/**
    - tests/fixtures/**
    - Cargo.toml
    - Cargo.lock

actions:
  allowed:
    - read
    - edit_allowed_paths
    - push
    - create_pr

  forbidden:
    - modify_tools
    - modify_reader_code
    - modify_fixtures
    - modify_golden_outputs
    - modify_cargo_toml
    - modify_cargo_lock
    - general_parser_claim
    - schema_claim
    - loader_claim
    - runtime_claim
    - production_ui_claim

constraints:
  - docs closeout only
  - fixture-facing ProjectionBundle sketch reader-core evidence only
  - no tool/code changes
  - no fixture changes
  - no golden output changes
  - no Cargo changes
  - no general parser claim
  - no schema claim
  - no loader claim
  - no runtime claim
  - no production UI claim
  - no general Level 4 claim
  - no Level 5+ claim

verification:
  required:
    - git diff --check
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness-check.ps1

report:
  output: .harness/reports/POST-UI-READER-CORE-DOCS-CLOSEOUT.md
