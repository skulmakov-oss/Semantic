authorization:
  rust_implementation: true
  rust_implementation_scope: >-
    new production Rust: two new crates (semantic-hub generic contract/
    runtime, semantic-hub-turbovec reference adapter over the real
    turbovec dependency), one new smc-cli module (hub.rs) plus its
    dispatch wiring in app.rs/lib.rs, plus tests/benches within the new
    crates and one new repo-root integration test file
    (tests/hub_cli.rs). No changes to compiler, verifier, VM, SemCode,
    or any existing PROMETHEUS crate's public API.
  new_external_dependency: true
  new_external_dependency_detail: >-
    turbovec = "=0.9.0" (crates.io, MIT license,
    https://github.com/RyanCodrai/turbovec), pinned to an exact version.
    Pulls in faer/gemm/nalgebra/rayon/rand as transitive build
    dependencies of that crate; no new direct dependency of
    semantic-hub itself beyond serde/serde_json (already present in the
    workspace via the root package).
  cli_command_implementation: true
  test_addition: true
  fixture_addition: true
  benchmark_addition: true
  documentation_addition: true
  public_api_change: true
  public_api_change_detail: >-
    Two brand-new public library crates (semantic-hub,
    semantic-hub-turbovec); registered with tests/public_api_contracts.rs
    per the existing snapshot-guard mechanism. smc-cli's own public
    surface (lib.rs re-exports) is unchanged -- the new hub.rs module is
    private, matching the existing ui_frame_inspect.rs pattern.
  dependency_lockfile_update: true
  owner_issue_lifecycle: true
  workflow_changes: true
  workflow_changes_detail: >-
    Narrow CI remediation, not a scope change: .github/workflows/ci.yml
    gained one identical step ("Install system BLAS (required by the
    turbovec Hub dependency on Linux)": apt-get install -y
    libopenblas-dev) added to the 4 ubuntu-latest jobs that link a
    default-features binary/test (boundary-enforcement, public-api-guard,
    runtime-release-gates, test-std). Root cause, confirmed from the
    actual failed CI run on this PR's exact head: turbovec's own
    Cargo.toml unconditionally enables ndarray's "blas" feature on
    target_os = "linux"/"macos", which requires linking against a system
    BLAS library the GitHub Actions Ubuntu runner does not have
    preinstalled ("rust-lld: error: unable to find library -lopenblas").
    This cannot be fixed from semantic-hub-turbovec's own Cargo.toml
    (Cargo feature unification is additive-only; a downstream crate
    cannot un-enable a feature an upstream crate's own
    target-conditional dependency turns on). No other workflow behavior,
    trigger, or job was changed.
  roadmap_changes: false
  project_changes: false
  workbench_implementation: false
  semantic_studio_implementation: false
  alm_changes: false
  hub_changes: true

