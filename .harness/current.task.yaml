    Define the Semantic-native readiness audit perimeter (N1-N8), evidence
    ladder, claim vocabulary, taxonomy, severity definitions and an exact
    machine-derived inventory of tracked .sm sources. #1617 remains the
    historical predecessor and is not closed or rewritten.
  decision_record: docs/roadmap/native_audit/charter.md

