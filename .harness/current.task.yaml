task:
  id: POST-UI-PROJECTION-BUNDLE-READER-VOCABULARY-SPLIT-AUDIT
  title: Audit ProjectionBundle reader vocabulary split
  type: audit
  mode: active

intent:
  summary: audit(post-ui): record ProjectionBundle reader vocabulary split

layer:
  name: tooling
  owner: post-ui

scope:
  allowed_paths:
    - .harness/current.task.yaml
    - .harness/reports/POST-UI-PROJECTION-BUNDLE-READER-VOCABULARY-SPLIT-AUDIT.md

  forbidden_paths:
    - tools/post_ui/projection_bundle_sketch_reader_draft.rs
    - tests/fixtures/**
    - docs/**
    - scripts/**
    - Cargo.toml
    - Cargo.lock

actions:
  allowed:
    - read
    - edit_allowed_paths
    - push
    - create_pr

  forbidden:
    - modify_docs
    - modify_cargo_toml
    - modify_cargo_lock
    - loader_claim
    - runtime_claim
    - production_ui_claim
    - level4_claim

constraints:
  - refactor only
  - no behavior changes
  - no docs changes
  - no Cargo changes
  - no loader claim
  - no runtime claim
  - no production UI claim
  - no Level 4 claim

verification:
  required:
    - git diff --check
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness-check.ps1
    - git status --short

report:
  output: .harness/reports/POST-UI-PROJECTION-BUNDLE-READER-VOCABULARY-SPLIT-AUDIT.md