task:
  id: POST-UI-PROJECTION-BUNDLE-READER-HARDEN-TRUST-METADATA-REQUIRED-FIELD-PROBES
  title: Harden ProjectionBundle trust metadata required field probes
  type: test
  mode: active

intent:
  summary: test(post-ui): harden ProjectionBundle trust metadata required field probes

layer:
  name: tooling
  owner: post-ui

scope:
  allowed_paths:
    - .harness/current.task.yaml
    - tools/post_ui/projection_bundle_sketch_reader_draft.rs
    - tools/post_ui/check_projection_bundle_reader_probes.ps1
    - tests/fixtures/post_ui/projection_bundle/probes/**
    - tests/fixtures/post_ui/projection_bundle/expected/probes.reader.out.txt

  forbidden_paths:
    - docs/**
    - scripts/**
    - Cargo.toml
    - Cargo.lock

actions:
  allowed:
    - read
    - edit_allowed_paths
    - push
    - create_pr

  forbidden:
    - modify_docs
    - modify_cargo_toml
    - modify_cargo_lock
    - loader_claim
    - runtime_claim
    - production_ui_claim
    - level4_claim

constraints:
  - test only
  - no behavior changes
  - no docs changes
  - no Cargo changes
  - no loader claim
  - no runtime claim
  - no production UI claim
  - no Level 4 claim

verification:
  required:
    - git diff --check
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness-check.ps1
    - pwsh -NoProfile -ExecutionPolicy Bypass -File tools/post_ui/check_projection_bundle_reader_probes.ps1

report:
  output: .harness/reports/POST-UI-PROJECTION-BUNDLE-READER-HARDEN-TRUST-METADATA-REQUIRED-FIELD-PROBES.md