task:
  id: SHF-3A2-U32-IMPLEMENTATION
  title: "Implement and qualify deterministic plain-u32 arithmetic and ordering (SHF-3A2)"
  type: implementation_qualification
  target: "Implement semantic.compiler.u32/0.1 (#2008) as SHF-3A2 of #1910: seven owner-approved opcodes (0x24-0x2A) gated by a new SEMCOD23 header, checked arithmetic, unsigned ordering, O0/O1 parity."
  mode: active
  supersedes: SHF-3A1-U32-CONTRACT
  issues: [2008]
  must_remain_open: [1910]
  base_sha: 0f373890782abccd8dc21bb6d9eedf39d959ffaa
  authorized_by: >-
    Repository owner explicit authorization (2026-10-08, "OWNER TASK - SHF-3A2
    U32 IMPLEMENTATION & QUALIFICATION"): controlled governance-envelope
    transition to SHF-3A2-U32-IMPLEMENTATION, R3, including exactly the opcodes
    CmpU32Lt=0x24, CmpU32Le=0x25, AddU32=0x26, SubU32=0x27, MulU32=0x28,
    DivU32=0x29, ModU32=0x2A and header SEMCOD23 (rev 24, V22 capabilities).
    No SHF-3B; no merge without separate owner GO; #1910 stays open.

intent:
  summary: >-
    Admit plain-u32 + - * / % and < <= > >= end to end (typecheck, IR, SemCode,
    verifier, VM, CrystalFold) exactly as frozen by semantic.compiler.u32/0.1,
    with SEMCOD23 required only by programs that use the new opcodes.
  decision_record: docs/spec/compiler_u32_v0.md

