task:
  id: SHF-2A2-BYTES-IMPLEMENTATION
  title: "Implement and qualify deterministic Bytes value family (SHF-2A2)"
  type: implementation_qualification
  target: "Implement and qualify semantic.compiler.bytes/0.1 (#2015) as SHF-2A2 of #1910: Type::Bytes, Value::Bytes(Vec<u8>), six core builtins (bytes_empty, bytes_len, bytes_push, bytes_extend, bytes_get, bytes_slice), CAP_BYTES_VALUES, SEMCOD24 header, CallableValueFamily::Bytes=15, no comparison operators, O0/O1 parity."
  mode: active
  supersedes: SHF-2A1-COMPLETE-HOLD
  issues: [2015]
  must_remain_open: [1910]
  base_sha: 61faff23527205605b501b5f3468ccf22a00588b
  authorized_by: >-
    Repository owner explicit task (2026-10-08, "OWNER TASK - SHF-2A2 BYTES
    IMPLEMENTATION & QUALIFICATION"): controlled governance-envelope transition
    to SHF-2A2-BYTES-IMPLEMENTATION on dedicated branch shf2a/bytes-implementation.
    Six core builtins, Bytes value family, CAP_BYTES_VALUES (1 << 28),
    SEMCOD24 header (rev 25), CallableValueFamily::Bytes = 15. No new opcodes;
    no SHF-2B; no SHF-2C; no merge without separate owner GO; #1910 stays open.

intent:
  summary: >-
    Implement and qualify the deterministic Bytes value family and its six core
    in-memory operations end to end across typecheck, IR lowering (call-dispatched),
    verifier admission, and VM execution, matching semantic.compiler.bytes/0.1.
  decision_record: docs/spec/compiler_bytes_v0.md

