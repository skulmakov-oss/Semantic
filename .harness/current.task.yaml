task:
  id: DOCS-ERROR-CODES-ENGLISH-TRANSLATION
  title: Translate error codes reference to English
  type: docs
  mode: active

intent:
  summary: docs(error-codes): translate reference to English

layer:
  name: documentation
  owner: language

scope:
  allowed_paths:
    - docs/ERROR_CODES.md
    - .harness/current.task.yaml
    - .harness/reports/DOCS-ERROR-CODES-ENGLISH-TRANSLATION.md

  forbidden_paths:
    - src/**
    - crates/**
    - tests/**
    - tools/**
    - scripts/**
    - Cargo.toml
    - Cargo.lock

actions:
  allowed:
    - read
    - edit_allowed_paths
    - push
    - create_pr

  forbidden:
    - modify_docs
    - modify_cargo_toml
    - modify_cargo_lock
    - loader_claim
    - runtime_claim
    - production_ui_claim
    - level4_claim

constraints:
  - refactor only
  - no behavior changes
  - no docs changes
  - no Cargo changes
  - no loader claim
  - no runtime claim
  - no production UI claim
  - no Level 4 claim

verification:
  required:
    - git diff --check
    - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness-check.ps1
    - git status --short

report:
  output: .harness/reports/DOCS-ERROR-CODES-ENGLISH-TRANSLATION.md