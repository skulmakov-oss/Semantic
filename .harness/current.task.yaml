task:
  id: SEMANTIC-HUB-V0-COMPLETION
  title: "feat(hub): complete bounded Semantic Hub v0 runtime"
  type: implementation
  mode: active
  supersedes: SEMANTIC-HUB-V0-TURBOVEC-E2E
  authorized_by: "repository owner direct instruction, Issue #1526 (architecture anchor, consumed by #1553/#1554/#1555, now completed to its own full acceptance criteria)"

intent:
  summary: "feat(hub): add a bounded persistent session executor, transactional intent/commit/recovery protocol, streaming audit reads, and a generic provenance envelope on top of the #1554/#1555 Semantic Hub v0 baseline, then close #1526"

scope:
  # #1554/#1555 landed a real single-request-per-process Hub v0 with
  # TurboVec as the reference adapter. This task extends that baseline
  # with the remaining #1526 acceptance-criteria gaps identified by
  # direct line-by-line audit (2026-07-27): a bounded multi-request
  # session executor with session-level ceiling attenuation, a
  # recoverable write-ahead transaction protocol for durable TurboVec
  # mutations, streaming (not full-materialize) audit reads, a generic
  # Hub-level provenance envelope embedded in HubReply, an extended
  # fault taxonomy (SensitiveCapabilityDenied, SessionLimitExceeded,
  # WorkerBusy, WorkerDegraded, PersistenceFailed, RecoveryRequired),
  # cooperative cancellation via a session-level cancel set, and one new
  # `smc hub session --requests <path>` CLI command. No subprocess/WASM/
  # remote execution mode. No Workbench/Studio/ALM work.
  allowed_paths:
    - .harness/current.task.yaml
    - .harness/reports/SEMANTIC-HUB-V0-COMPLETION.md
    - Cargo.toml
    - Cargo.lock
    - crates/semantic-hub/**
    - crates/semantic-hub-turbovec/**
    - crates/smc-cli/src/hub.rs
    - tests/public_api_contracts.rs
    - tests/golden_snapshots/public_api/semantic_hub_lib.txt
    - tests/golden_snapshots/public_api/semantic_hub_turbovec_lib.txt
    - tests/hub_cli.rs
    - tests/hub_fixture_line_ending_guard.rs
    - tests/fixtures/hub/**
    - docs/architecture/semantic_hub_v0.md
    - docs/spec/hub/**
    - docs/security/semantic_hub_threat_model_v0.md
    - docs/privacy/semantic_hub_data_policy_v0.md
    - docs/spec/cli.md

  forbidden_paths:
    - crates/sm-front/**
    - crates/sm-sema/**
    - crates/sm-ir/**
    - crates/sm-emit/**
    - crates/sm-verify/**
    - crates/sm-runtime-core/**
    - crates/sm-vm/**
    - crates/sm-profile/**
    - crates/sm-format/**
    - crates/ton618-core/**
    - crates/prom-abi/**
    - crates/prom-refs/**
