intent:
  summary: >-
    Before repairing any individual diagnostic/span/formatter/editor
    finding, first freeze a Diagnostic Authority decision answering: source
    surface authority, diagnostic identity authority, file identity
    authority, and source range authority — this is SSF-09's required first
    step, not an implementation-order convenience, mirroring SSF-08's own
    Position A/B precedent. A read-only entry reconnaissance
    (SSF09-E0 predecessor checkpoint) already reconstructed the current
    state: no single canonical diagnostic type exists (FrontendError/
    SemanticDiagnostic/VerificationDiagnostic/RuntimeError are four
    independent shapes), no single span authority exists (four incompatible
    position models, `file_id` always 0), and no machine-readable schema
    exists at all. Only after the Diagnostic Authority decision is recorded:
    work the diagnostic repair DAG in dependency order (#1670 -> #1697 +
    #1698 + #1699 -> catalog coherence (#1704 and the E0243 gap) -> a
    canonical internal carrier -> a versioned external schema), each
    grounded in the selected authority rather than patched independently.
    Editor/LSP work may only orchestrate this canonical authority — it must
    never become a second parser/typechecker/verifier/diagnostic authority.
    Add positive end-to-end tests and deterministic negative cases for every
    included diagnostic/span form; give every deferred form an explicit
    non-goal and a deterministic rejection diagnostic instead of leaving it
    silently unsupported.

