task:
  id: S15-G1A-CATALOG-SCOPE-MIGRATION
  title: "Owner-Controlled Migration Entry for Admission Catalog Scope"
  type: governance_migration
  target: >-
    S15-G1 Stage G1-A only. Hold the trusted envelope in governance_migration
    for at most four hours and for exactly one envelope-only transition, either
    the Stage G1-B successor (blob 055cc127697fd5802e491f594b0f8f2ac6fd5080)
    that restores foundation_delivery and adds
    crates/ton618-core/src/diagnostics.rs and docs/ERROR_CODES.md to the
    Foundation allowlist, or restoration of the unchanged Foundation envelope
    (blob a57b10e0cdaa055494ad70fb2f044175190a47a9). This envelope authorizes
    no technical work.
  mode: active
  supersedes: SHF-FOUNDATION-DELIVERY-STABLE
  issues: [1910]
  must_remain_open: [1910]
  base_sha: b89ee10fed1335a9ffab1e40d2bf727b7e18d2e7
  authorized_by: >-
    Repository owner preparation decision S15-G1A-PREP (2026-11-11) approved
    the two-stage route (OD-G1-1 A), a maximum migration window of four hours
    (OD-G1-2) and the exact two-line Stage G1-B successor (OD-G1-3).
    Installing this envelope requires a separate explicit OWNER EXECUTION GO
    naming this exact blob, the trusted base
    b89ee10fed1335a9ffab1e40d2bf727b7e18d2e7, the successor blob
    055cc127697fd5802e491f594b0f8f2ac6fd5080 and the recovery blob
    a57b10e0cdaa055494ad70fb2f044175190a47a9. The window runs from the merge
    of this envelope to the merge of the successor or recovery envelope.

intent:
  summary: >-
    Migration window only. The admissible changes are one envelope-only PR
    installing the pinned Stage G1-B successor or, on abort, one envelope-only
    PR restoring the unchanged Foundation envelope. No compiler, language,
    runtime, verifier, SemCode, workflow, dependency, release or tag work is
    authorized while this envelope is active.
  decision_record: docs/agents/WORKFLOW.md

governance_constraints:
  compiler_implementation: false
  language_implementation: false
  runtime_implementation: false
  verifier_changes: false
  semcode_changes: false
  builtin_changes: false
  workflow_changes: false
  dependency_changes: false
  release_tag_changes: false
  merge_without_owner_go: false

scope:
  allowed_paths:
    - .harness/current.task.yaml

  forbidden_paths:
    - .github/**
    - scripts/**
    - AGENTS.md
    - CONSTRAINTS.md
    - tests/harness_scope_enforcement.ps1
    - docs/agents/WORKFLOW.md
    - Cargo.toml
    - Cargo.lock
    - crates/*/Cargo.toml
    - crates/*/Cargo.lock
    - apps/**
    - examples/**
    - reports/**
    - tools/**
    - experiments/**
    - third_party/**
    - ton618_legacy/**
    - prom-ui*
    - releases/**
    - release/**
    - artifacts/**
    - docs/releases/**
    - docs/roadmap/**

authorization:
  rust_implementation: false
  language_implementation: false
  documentation_addition: false
  documentation_correction: false
  test_addition: false
  workflow_changes: false
  dependency_changes: false
  github_issue_lifecycle: false
  git_commit_push_pr: true
  merge_after_review_and_checks: false
  stable_promotion: false

constraints:
  base_branch: main
  base_sha: b89ee10fed1335a9ffab1e40d2bf727b7e18d2e7
  c1_sha: 89641da8237f4fcefb50cf1958a50e4d4003aea7
  release_tag: v1.2.0
  release_assets_immutable: true
  no_release_or_tag: true
  no_issue_close: true
  no_merge_without_owner_go: true
  no_historical_document_rewrite: true
  one_logical_change_per_pr: true
  evidence_before_claims: true
  explicit_owner_go_for_each_task: true
  explicit_owner_go_for_opcode_or_public_contract_changes: true
  normative_contracts_required: true
  verifier_first_required: true
  deterministic_proof_required: true
  unrelated_fa_findings_out_of_scope: true

