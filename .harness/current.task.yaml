task:
  id: SEMANTIC-WORKBENCH-NATIVE-V0
  title: "feat(workbench): implement Semantic Workbench as a native Semantic + Prom UI application"
  type: implementation
  mode: active
  supersedes: SEMANTIC-HUB-V0-COMPLETION
  authorized_by: "repository owner direct instruction (chat, 2026-08-01): narrow owner override authorizing local Workbench implementation per issue #1369 (\"Workbench before Semantic Studio\"). Semantic Studio implementation, ALM integration, and GitHub governance changes remain explicitly out of scope."

intent:
  summary: >-
    Build the canonical Semantic Workbench (developer/operator Evidence
    Console + project opener + source authoring shell + canonical command
    bus + deterministic Jobs Ledger + diagnostics projection + inspectors +
    spec navigator + readiness/release evidence view) as a Semantic-owned
    application: .sm application state/logic + a Grammar v0 Projection
    Source UI definition, rendered through the existing real prom-ui /
    prom-ui-runtime / prom-ui-backend-native native pipeline (the same
    pipeline already proven end-to-end by examples/quad_logic_calculator),
    with a narrow Rust host limited to filesystem, process execution,
    persistence, and native window/renderer effects. The obsolete
    React/TypeScript/Tauri app (archived at apps/workbench_ts_tauri_legacy,
    formerly apps/workbench) is a non-authoritative reference only (IA/visual
    ideas), not a logic or contract source.

status_note: >-
  SEMANTIC-HUB-V0-COMPLETION closed 2026-08-01: Issue #1526 closed,
  final follow-up landed via PR #1566 (commit 9ce1edc6) on top of the
  irregular PR #1558 delivery documented in
  .harness/reports/SEMANTIC-HUB-V0-COMPLETION.md. This file was left
  declaring that task "active" after it actually finished; superseding
  it here rather than leaving stale state pointing at a closed task.

owner_directive_2026_08_02: >-
  "WORKBENCH ICED SUBSTRATE MIGRATION" (repository owner, chat,
  2026-08-02), issued after this task's own prior FAIL verdict on the
  "WORKBENCH VISUAL ARCHITECTURE COMPLETION PASS" identified three
  unmet requirements (no generic component library, no real typography/
  text-measurement, zero screenshot artifacts). The owner explicitly
  authorized crossing the narrow-host-bridge boundary that previously
  blocked closing those gaps: pin Iced 0.14 as a private native UI
  substrate behind a new `prom-ui-iced-adapter` crate, modify the Prom UI
  renderer/runtime/native backend as needed, migrate all 8 Workbench
  screens onto it, and implement deterministic frame capture. Semantic
  remains authoritative for Workbench application meaning; Iced is
  infrastructure behind the adapter boundary, never a direct Workbench
  dependency. This directive explicitly forbids reporting the harness,
  a missing primitive, or component/typography/capture infrastructure
  as an external blocker for this task.

status_note_2026_08_03: >-
  "WORKBENCH ICED SUBSTRATE MIGRATION" pass result: FAIL, for one specific,
  named reason (see .harness/reports/SEMANTIC-WORKBENCH-NATIVE-V0.md's
  "WORKBENCH ICED SUBSTRATE MIGRATION" section, VERDICT). Iced 0.14.0 is
  pinned, the dependency boundary holds under real tests, Semantic
  authority is preserved, all 8 screens are migrated onto a real 26-role
  PromNode contract via a real Iced adapter, the production binary is
  unconditionally Iced-only (the WORKBENCH_ICED flag is removed), real
  deterministic headless frame capture works and was proven independent
  of foreground focus, and 28 reviewed screenshots plus a manifest exist.
  The FAIL reason: crates/prom-ui-iced-adapter/src/convert.rs's SplitPane
  renders correct static proportions but implements no pointer capture /
  live divider dragging, a capability owner directive section 19 names
  explicitly and section 29 treats as PASS-disqualifying when absent.
  Everything else required is real and verified; this is the one concrete
  remaining item, reported as fact per this task's standing instruction
  not to propose another pass.

status_note_2026_08_03_closure: >-
  "WORKBENCH ICED MIGRATION -- FINAL CLOSURE" pass result: PASS (see
  .harness/reports/SEMANTIC-WORKBENCH-NATIVE-V0.md's "WORKBENCH ICED
  MIGRATION -- FINAL CLOSURE" section). Real pointer-driven divider
  dragging is implemented for all three Workbench SplitPane dividers via
  iced::widget::pane_grid (an existing shipped Iced widget, not a new
  dependency), closing the one named gap from the prior FAIL. Live
  drag-verification screenshots (extreme ratios on all 3 dividers at
  960x640/1440x900/1920x1080) surfaced one real regression this pass
  introduced: dragging explorer_and_rest (divider 2) toward its high
  extreme could squeeze the nested main_and_inspector split (divider 3)
  below its own two-sided minimum, driving the Cockpit content pane to a
  negative/invisible width -- an "inaccessible panel" violation, only
  reachable now that dragging exists. Fixed in
  examples/workbench_semantic/src/main.rs by lowering
  main_and_inspector's split_min from 160.0 to 64.0 so it always fits
  inside explorer_and_rest's 140.0 floor; both dividers' own default
  (undragged) ratios are unaffected. All 21 drag-verification
  screenshots re-reviewed after the fix and confirmed clean. 63 tests
  pass (15 in prom-ui-iced-adapter incl. 7 new drag tests, 48 in
  workbench_semantic), cargo fmt --check/clippy/cargo check
  --workspace/harness-check all pass.

