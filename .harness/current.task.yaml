task:
  id: Q3.10-D3-G2-ADMISSION-WORKSPACE-BOOTSTRAP
  title: "Scoped D3-G2 admission workspace foundation"
  type: foundation_delivery
  target: >-
    Prepare a bounded, explicitly owner-authorized D3-G2 workspace foundation
    for sm-admission. This is a temporary proposal, not a permanent Foundation
    authority. Implementation Independence. Specification Unity. Deterministic
    Proof. The trusted PR base envelope and checker remain the authority for
    candidate admission; ordinary work cannot modify that authority.
  mode: active
  supersedes: FOUNDATION-GOVERNANCE-MIGRATION
  issues: [1910]
  must_remain_open: [1910]
  base_sha: db86eb7897367d880d303e8f803a06e5219b3cd2
  authorized_by: >-
    Preparation artifact only. No production bootstrap, trusted-base transition,
    Cargo authorization, merge or owner approval is established by this file.
    A separate owner decision must name the exact trusted base, candidate SHA,
    scope, expiry and restoration evidence before any live transition.

intent:
  summary: >-
    Proposed temporary D3-G2 path scope only. It does not approve new opcodes,
    SemCode revisions, public contract changes, release claims, self-hosting
    completion, issuer activation or revision-27 execution. Those require
    separate technical justification, deterministic qualification and explicit
    owner approval. This proposal does not itself authorize a merge or protected
    main change.
  decision_record: docs/agents/WORKFLOW.md

