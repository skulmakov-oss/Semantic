task:
  id: AGENT-INFRA-02
  title: "agent infrastructure: agent adapters, MCP workflow & PR verification cleanup"
  type: governance_maintenance_transition
  mode: active_temporary_governance_envelope
  supersedes: AGENT-INFRA-01
  authorized_by: >-
    Repository owner explicit authorization in GitHub issue #1845 and Umbrella
    #1843. Temporary governance-maintenance envelope to authorize client
    instruction adapters, MCP workflow consolidation, and PR verification
    template updates; SSF-07 development envelope will be restored prior to merge.

intent:
  summary: >-
    Remove duplicated and contradictory agent instructions across client adapters.
    Make AGENTS.md, CONSTRAINTS.md, docs/agents/WORKFLOW.md, and
    docs/agents/VERIFICATION.md the sole canonical authorities. Convert
    .agents/AGENTS.md, .github/copilot-instructions.md, and
    .github/instructions/codebase-workflow.instructions.md into thin bootstrap
    adapters. Enforce fail-closed blocker protocol with no autonomous fallback for
    Codebase Memory MCP. Modernize PR verification template with R0-R3 risk tiers
    and explicit evidence placeholders.

scope:
  allowed_paths:
    - .harness/current.task.yaml
    - .agents/AGENTS.md
    - .github/copilot-instructions.md
    - .github/instructions/codebase-workflow.instructions.md
    - .github/PULL_REQUEST_TEMPLATE/post_stable_slice.md

  forbidden_paths:
    - .github/workflows/**
    - .agents/skills/**
    - crates/**
    - docs/spec/**
    - apps/**
    - src/**
    - tests/**
    - third_party/**
    - ton618_legacy/**

authorization:
  rust_implementation: false
  language_implementation: false
  documentation_addition: true
  documentation_correction: true
  test_addition: false
  workflow_changes: false
  dependency_changes: false
  github_issue_lifecycle: true
  git_commit_push_pr: true
  merge_after_review_and_checks: true
  stable_promotion: false

constraints:
  issue: 1845
  umbrella_issue: 1843
  base_branch: main
  one_logical_change_per_pr: true
  evidence_before_claims: true
  no_production_code_change: true
  no_dependency_change: true
  no_ci_workflow_change: true
  no_skill_decomposition: true
  no_autonomous_fallback: true
  restore_ssf07_before_merge: true
