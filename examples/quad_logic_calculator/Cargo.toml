[package]
name = "quad_logic_calculator"
version = "0.1.0"
edition = "2021"
authors = ["Said Kulmakov"]
license = "Apache-2.0"
publish = false

[dependencies]
prom-ui = { path = "../../crates/prom-ui", default-features = false, features = ["std"] }
prom-ui-runtime = { path = "../../crates/prom-ui-runtime", default-features = false, features = ["std"] }
prom-ui-backend-native = { path = "../../crates/prom-ui-backend-native", default-features = false, features = ["std", "winit-backend", "wgpu-backend"] }
semantic-core-quad = { path = "../../crates/semantic-core-quad", default-features = false, features = ["std"] }
sm-emit = { path = "../../crates/sm-emit", default-features = false, features = ["std"] }
sm-vm = { path = "../../crates/sm-vm", default-features = false, features = ["std"] }
sm-verify = { path = "../../crates/sm-verify", default-features = false, features = ["std"] }
sm-runtime-core = { path = "../../crates/sm-runtime-core", default-features = false, features = ["std"] }
prom-abi = { path = "../../crates/prom-abi", default-features = false, features = ["std"] }

[[bin]]
name = "quad_calc"
path = "src/main.rs"
