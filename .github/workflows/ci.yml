name: CI

on:
  push:
  pull_request:

env:
  # Opt into the upcoming GitHub Actions Node 24 runtime now so CI is
  # validated before the platform-wide default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: PR-ready format and clippy baseline
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

  boundary-enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Root cleanliness and legacy perimeter guard
        run: cargo test --test legacy_guards --quiet
      - name: Boundary and ownership guards
        run: |
          cargo test --test frontend_boundaries --quiet
          cargo test --test ir_opt_boundaries --quiet
          cargo test --test dependency_boundaries --quiet

  public-api-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Public API inventory guard
        run: cargo test --test public_api_contracts --quiet

  runtime-release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Runtime and SemCode release-facing validation gates
        run: |
          cargo test --test golden_semcode --quiet
          cargo test --test prometheus_runtime_matrix --quiet
          cargo test --test prometheus_runtime_goldens --quiet
          cargo test --test prometheus_runtime_negative_goldens --quiet
          cargo test --test prometheus_runtime_compat_matrix --quiet

  release-bundle-process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify release bundle process
        shell: pwsh
        run: |
          pwsh -File scripts/verify_release_bundle.ps1 -ManifestPath "${{ runner.temp }}/semantic_v1_release_bundle_manifest.json"

  test-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (std)
        run: cargo test --all-targets --quiet

  check-no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check (no default features)
        run: cargo check --no-default-features --quiet
