name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only repository members can trigger Claude; mentions are matched case-insensitively.
    # Keep assigned subscribed, but v1's mention trigger handles only opened issues.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-${{ github.event_name }}-${{ github.event.comment.id || github.event.review.id || github.event.issue.number }}-${{ github.event.action }}
      cancel-in-progress: false
    # Use the job token, not an App token with implicit contents:write.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      # Tag mode checks out PR files. Reject forks before it receives model credentials.
      - name: Restrict PR checkout to this repository
        id: scope
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const number = context.payload.pull_request?.number ??
              (context.payload.issue?.pull_request ? context.payload.issue.number : null);
            if (number === null) {
              core.setOutput('allowed', 'true');
              return;
            }
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            const allowed = pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            core.setOutput('allowed', String(allowed));
            if (!allowed) core.notice('Fork PRs require a separately authorized integration.');
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        if: steps.scope.outputs.allowed == 'true'
        with:
          github_token: ${{ github.token }}
          # OAuth takes precedence; configure either secret, never paste credentials in comments.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          trigger_phrase: "@claude"
          # Review/comment tools only; no candidate shell, edits, commits or pushes.
          claude_args: >-
            --max-turns 20
            --tools Read,Glob,Grep
            --setting-sources user
            --strict-mcp-config
            --allowedTools mcp__github_inline_comment__create_inline_comment
            --disallowedTools Bash,Edit,MultiEdit,Write,NotebookEdit,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files
          show_full_output: false
