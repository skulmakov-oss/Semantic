name: Verify Embedding Model Integrity

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-model-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download reference model weights from Hugging Face
        run: |
          curl -fSL -o model_quantized.onnx \
            https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/onnx/model_quantized.onnx

      - name: Compute SHA-256 of downloaded weights
        id: hash
        run: |
          ACTUAL=$(sha256sum model_quantized.onnx | awk '{print $1}')
          echo "actual=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Compare against pinned hash
        id: compare
        run: |
          EXPECTED=$(awk '{print $1}' .github/model-integrity/embedding-model.sha256)
          ACTUAL="${{ steps.hash.outputs.actual }}"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          if [ "$EXPECTED" = "$ACTUAL" ]; then
            echo "Hash matches pinned value: $ACTUAL"
          else
            echo "::error::Embedding model hash mismatch. Expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - name: Clean up downloaded weights
        if: always()
        run: rm -f model_quantized.onnx

      - name: Open issue on mismatch
        if: steps.compare.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const expected = "${{ steps.compare.outputs.expected }}";
            const actual = "${{ steps.hash.outputs.actual }}";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "⚠️ Embedding model hash mismatch — verify weights source",
              body: [
                "Weekly integrity check found that the embedding model weights hosted at",
                "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/onnx/model_quantized.onnx",
                "no longer match the hash pinned in `.github/model-integrity/embedding-model.sha256`.",
                "",
                `**Expected:** \`${expected}\``,
                `**Got:** \`${actual}\``,
                "",
                `Failed run: ${runUrl}`,
              ].join("\n"),
            });
